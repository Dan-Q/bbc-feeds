# Editions of BBC News that we improve.
# Each has:
# -      url: URL of the RSS feed
# - variants: defined in variant-definitions.yml, these specify what gets filtered out;
#             no-sports filtering doesn't work well in non-English languages nor make sense
#             for sports "editions"
#      title: optional title; if not specified the key is used
# -     icon: optional emoji to represent the output feed(s)
#
# An edition set to `false` is a visual break in the list of feeds on the index page.
#

# Main, category, and regional editions:
full:
  url: https://feeds.bbci.co.uk/news/rss.xml
  variants:
  - sports
  - no-sports
uk:
  url: https://feeds.bbci.co.uk/news/uk/rss.xml
